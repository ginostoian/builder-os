<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer style="background:#FAFAF9;border-top:1px solid #ECEBE7;font-family:Geist,system-ui,sans-serif;color:#111110">
  <div style="max-width:1200px;margin:0 auto;padding:64px 24px 32px;display:flex;flex-direction:column;gap:56px">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:40px">
      <div style="display:flex;flex-direction:column;gap:14px;min-width:220px">
        <div style="display:flex;align-items:center;gap:9px">
          <span style="width:26px;height:26px;border-radius:7px;background:#111110;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 5.5px;box-sizing:border-box">
            <span style="height:3px;background:#fff;border-radius:1px"></span>
            <span style="display:flex;gap:2px"><span style="height:3px;flex:1;background:#fff;border-radius:1px"></span><span style="height:3px;flex:2;background:#fff;border-radius:1px"></span></span>
            <span style="height:3px;background:oklch(0.66 0.17 42);border-radius:1px"></span>
          </span>
          <span style="font-weight:600;font-size:17px;letter-spacing:-0.025em">Builder<span style="color:#8A8984;font-weight:500"> OS</span></span>
        </div>
        <p style="margin:0;color:#5C5B57;font-size:14px;line-height:1.55;max-width:260px">The operating system for UK renovation companies. Quote it, build it, get paid.</p>
      </div>
      <sc-for list="{{ cols }}" as="c" hint-placeholder-count="3">
        <div style="display:flex;flex-direction:column;gap:10px">
          <div style="font-size:13px;font-weight:500;color:#8A8984;margin-bottom:4px">{{ c.title }}</div>
          <sc-for list="{{ c.links }}" as="l" hint-placeholder-count="5"><a href="{{ l.href }}" style="font-size:14px;color:#3E3D39;text-decoration:none">{{ l.label }}</a></sc-for>
        </div>
      </sc-for>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;padding-top:24px;border-top:1px solid #ECEBE7;font-size:13px;color:#8A8984">
      <span>© 2026 Builder OS Ltd · Registered in England &amp; Wales</span>
      <div style="display:flex;gap:20px"><a href="#" style="color:#8A8984;text-decoration:none">Privacy</a><a href="#" style="color:#8A8984;text-decoration:none">Terms</a><a href="#" style="color:#8A8984;text-decoration:none">Cookies</a><a href="#" style="color:#8A8984;text-decoration:none">Status</a></div>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:380}}">
class Component extends DCLogic {
  renderVals() {
    const L = arr => arr.map(([label, href]) => ({ label, href: href || '#' }));
    return { cols: [
      { title: 'Product', links: L([['Quoting', 'Features.dc.html#quoting'], ['Variations', 'Features.dc.html#variations'], ['Client portal', 'Features.dc.html#portal'], ['Payments & invoicing', 'Features.dc.html#payments'], ['Projects', 'Features.dc.html#projects'], ['Team app', 'Features.dc.html#team'], ['CRM & reporting', 'Features.dc.html#crm']]) },
      { title: 'Company', links: L([['About', 'About.dc.html'], ['Customers', 'Customers.dc.html'], ['Blog', 'Blog.dc.html'], ['Contact', 'About.dc.html#contact']]) },
      { title: 'Get started', links: L([['Pricing', 'Pricing.dc.html'], ['Book a demo', 'Book a Demo.dc.html'], ['Sign in', 'Builder OS App.dc.html'], ['Help centre']]) }
    ] };
  }
}
</script>
</body>
</html>
