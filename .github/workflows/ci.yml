name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway database that only exists inside this job, so no password at all (and nothing for
          # secret scanners to flag). The test roles' passwords are ignored under trust auth.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: builderos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL_ADMIN: postgres://postgres@localhost:5432/builderos_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migration drift
        run: pnpm db:check
      - name: Tenant isolation and Clerk sync (real Postgres)
        run: pnpm test:db
      # No Clerk keys needed: every Clerk page renders on demand, and the marketing site doesn't load Clerk.
      - run: pnpm build
